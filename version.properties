# The app version. This is the ONLY place to change it: edit the two lines below, nothing else.
#
# VERSION_NAME  what people see in About and in the APK name, for example 0.1.0
# VERSION_CODE  a whole number (1, 2, 3, ...). It must go UP by at least 1 for every build that is
#               installed over an older one; Android refuses to update to the same or a lower number.
#
# Or run:  python3 scripts/set_version.py 0.1.0        (sets the name, VERSION_CODE + 1)
#          python3 scripts/set_version.py 0.1.0 --code 7
VERSION_NAME=0.0.1-poc
VERSION_CODE=1
